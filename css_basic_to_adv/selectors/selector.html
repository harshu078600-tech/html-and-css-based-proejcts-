<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Selectors Practice</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="selector.css">
</head>

<body>

  <!-- Element Selector -->
  <h1>Hello</h1>

  <!-- Descendant Selector Practice -->
  <div>
    This is outer box

    <div>
      This is middle box

      <p>
        Hello, this is inner paragraph
      </p>
    </div>
  </div>

  <!-- Adjacent Sibling Selector Practice -->
  <p class="parabox">How are you?</p>
  <p>Immediate next paragraph</p>
  <p>Not selected</p>
  <p>Not selected</p>

  <!-- Attribute Selector Practice -->
  <a href="" target="_blank">
    Link with target attribute
  </a>

  <a href="">
    Link without target attribute
  </a>

</body>

</html>
